# Configuration for Resume-to-JD Fit Scorer
# Weights are exposed here as configuration rather than hardcoded in the scoring engine.

# Scoring dimension weights (must sum to 1.0; auto-normalized if small discrepancy exists)
weights:
  skills_match: 0.35
  semantic_similarity: 0.20
  experience_match: 0.25
  education_match: 0.10
  seniority_fit: 0.10

# Hard scoring constraints & caps
hard_caps:
  low_skills_threshold: 0.25
  low_skills_max_score: 45.0
  seniority_mismatch_max_score: 60.0

# Models & Providers
models:
  embedding_primary: "all-MiniLM-L6-v2"
  embedding_fallback: "BAAI/bge-small-en-v1.5"
  groq_primary_llm: "openai/gpt-oss-20b"
  groq_secondary_llm: "openai/gpt-oss-120b"
  groq_guard_model: "meta-llama/llama-prompt-guard-2-86m"
  gemini_fallback_model: "gemini-2.0-flash-lite"

# LLM & Generation parameters
llm:
  temperature: 0.0
  max_tokens: 600
  timeout_seconds: 15
  retry_attempts: 2

# Input size & upload constraints
limits:
  max_file_size_mb: 5
  min_text_length: 50
  max_resume_chars_llm: 4000
  max_jd_chars_llm: 2000
